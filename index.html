<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T3rr0r Proxy Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: Arial; background: #111; color: #eee; }
    #top { padding: 10px; background: #222; display: flex; gap: 10px; }
    #url { flex: 1; padding: 10px; border-radius: 6px; border: none; font-size: 16px; }
    button { padding: 10px 20px; border: none; border-radius: 6px; background: #4a8; color: #fff; cursor: pointer; }
    iframe { width: 100%; height: calc(100vh - 60px); border: none; background: #000; }
  </style>
</head>
<body>

<div id="top">
  <input id="url" placeholder="Search or enter URL…">
  <button onclick="go()">Go</button>
</div>

<iframe id="view"></iframe>

<script>
async function registerSW() {
  if ("serviceWorker" in navigator) {
    await navigator.serviceWorker.register("./sw.js");
    console.log("Service worker registered");
  }
}

registerSW();

function go() {
  const input = document.getElementById("url").value.trim();
  const iframe = document.getElementById("view");

  let target = input;

  if (!input.startsWith("http://") && !input.startsWith("https://")) {
    target = "https://duckduckgo.com/?q=" + encodeURIComponent(input);
  }

  iframe.src = "proxy/" + btoa(target);
}
</script>

</body>
</html>
