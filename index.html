<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;

    }

    .container {

    h1 {

      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    select {
      padding: 10px;
      border-radius: 10px;
      background: #374151;
      color: white;
      border: none;
      margin-bottom: 15px;
    }

    iframe {
      width: 100%;
      height: 520px;
      border: none;
      border-radius: 12px;
      background: white;
    }

    #results {
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      border-top: 1px solid #374151;
      padding-top: 15px;
    }

    .link-card {
      background: #374151;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      word-break: break-all;
    }

    .good { color: #22c55e; }
    .bad { color: #ef4444; }
  </style>
</head>
<body>

      <button onclick="openTerminal()">Terminal</button>
      <div>

      </div>
    </div>

    <div id="terminalWindow"
style="
display:none;
position:fixed;
top:60px;
left:40px;
width:700px;
height:450px;
background:#020617;
border:2px solid #374151;
border-radius:14px;
z-index:9999;
overflow:hidden;
box-shadow:0 0 25px rgba(0,0,0,0.5);
font-family:monospace;
">

  <div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#111827;
  border-bottom:1px solid #374151;
  ">
    <span style="color:white;">Proxy Terminal</span>

    <button onclick="closeTerminal()"
    style="
    background:#ef4444;
    border:none;
    color:white;
    padding:4px 10px;
    border-radius:6px;
    cursor:pointer;
    ">
      X
    </button>
  </div>

  <div id="terminalOutput"
  style="
  height:340px;
  overflow-y:auto;
  padding:10px;
  color:#22c55e;
  font-size:14px;
  white-space:pre-wrap;
  ">
  </div>

  <div style="
  display:flex;
  align-items:center;
  padding:8px;
  border-top:1px solid #374151;
  background:#020617;
  color:#22c55e;
  ">
    <span>C:\ProxyViewer&gt;</span>

    <input
      id="terminalInput"
      autocomplete="off"
      spellcheck="false"
      style="
      flex:1;
      margin-left:8px;
      background:transparent;
      border:none;
      outline:none;
      color:#22c55e;
      font-family:monospace;
      font-size:14px;
      "
      onkeydown="handleTerminal(event)"
    />
  </div>

</div>

    <div class="input-row">
      <input id="urlInput" placeholder="https://example.com" />
      <button onclick="checkLinks()">Check</button>
    </div>

    <!-- PREVIEW FIRST -->
    <h3>Site Preview</h3>
    <iframe id="siteFrame"></iframe>

    <!-- RESULTS UNDER PREVIEW -->
    <div id="results"></div>

  </div>

function populateProxySelect() {
  const sel = document.getElementById("proxySelect");
  if (!sel) return;

  sel.innerHTML = "";

  proxies.forEach((p, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = p.name;
    sel.appendChild(opt);
  });

  sel.selectedIndex = 0;
}

window.addEventListener("DOMContentLoaded", populateProxySelect);

function normalize(url) {
  if (!url.startsWith("http")) url = "https://" + url;
  return url;
}

function getProxyUrl(url) {
  const sel = document.getElementById("proxySelect");
  const proxy = proxies[sel ? sel.value : 0];
  return proxy.url + encodeURIComponent(url);
}

async function checkLinks() {
  const input = document.getElementById("urlInput");
  const results = document.getElementById("results");
  const iframe = document.getElementById("siteFrame");

  if (!input || !results || !iframe) return;

  const url = normalize(input.value.trim());
  if (!url) return;

  results.innerHTML = "Loading...";

  try {
    const proxyUrl = getProxyUrl(url);

    // live preview
    iframe.src = proxyUrl;

    // fetch html
    const res = await fetch(proxyUrl);
    const html = await res.text();

    const doc = new DOMParser().parseFromString(html, "text/html");
    const baseHost = new URL(url).hostname;

    const links = [...doc.querySelectorAll("a[href]")]
      .map(a => a.href)
      .filter(h => h.startsWith("http"));

    const external = links.filter(l => {
      try {
        return new URL(l).hostname !== baseHost;
      } catch {
        return false;
      }
    });

    results.innerHTML = `<b>${external.length} external links found</b>`;

    external.forEach(l => {
      const div = document.createElement("div");
      div.className = "link-card";
      div.innerHTML = `<a href=\"${l}\" target=\"_blank\">${l}</a>`;
      results.appendChild(div);
    });

  } catch (e) {
    results.innerHTML = "<span class='bad'>Failed to load site</span>";
  }
}

let currentColor = "#22c55e";

function terminalLog(text) {
  const output = document.getElementById("terminalOutput");
  if (!output) return;

  const line = document.createElement("div");
  line.textContent = text;
  output.appendChild(line);
  output.scrollTop = output.scrollHeight;
}

function openTerminal() {
  document.getElementById("terminalWindow").style.display = "block";
  terminalLog("Proxy terminal initialized");
}

function closeTerminal() {
  document.getElementById("terminalWindow").style.display = "none";
}

function applyColor(color) {
  const out = document.getElementById("terminalOutput");
  const inp = document.getElementById("terminalInput");
  if (!out || !inp) return;

  out.style.color = color;
  inp.style.color = color;
  currentColor = color;
}

function resetTheme() {
  const terminal = document.getElementById("terminalWindow");
  const out = document.getElementById("terminalOutput");
  const inp = document.getElementById("terminalInput");

  if (!terminal || !out || !inp) return;

  terminal.style.background = "#020617";
  terminal.style.border = "2px solid #374151";
  out.style.background = "#020617";
  out.style.color = "#22c55e";
  inp.style.color = "#22c55e";
}

function setTheme(name) {
  const terminal = document.getElementById("terminalWindow");
  const out = document.getElementById("terminalOutput");
  const inp = document.getElementById("terminalInput");

  if (!terminal || !out || !inp) return;

  if (name === "default") {
    resetTheme();
  } else if (name === "purpur") {
    terminal.style.background = "#1e1033";
    terminal.style.border = "2px solid #9333ea";
    out.style.color = "#c084fc";
    inp.style.color = "#c084fc";
  } else if (name === "cali") {
    terminal.style.background = "linear-gradient(135deg,#991b1b,#1d4ed8)";
    terminal.style.border = "2px solid white";
    out.style.color = "white";
    inp.style.color = "white";
  }
}

async function handleTerminal(event) {
  if (event.key !== "Enter") return;

  const input = document.getElementById("terminalInput");
  if (!input) return;

  const cmd = input.value.trim();
  if (!cmd) return;

  terminalLog("C:\ProxyViewer> " + cmd);
  input.value = "";

  if (cmd === "/help") {
    terminalLog("/help /testprox /func /terminal color:<color> /terminal theme reset /terminal theme <name>");
    return;
  }

  if (cmd === "/func") {
    terminalLog("Coming later");
    return;
  }

  if (cmd === "/terminal theme reset") {
    resetTheme();
    terminalLog("Theme reset");
    return;
  }

  if (cmd.startsWith("/terminal theme ")) {
    setTheme(cmd.split(" ")[2]);
    return;
  }

  if (cmd === "/terminal color:green") {
    applyColor("#22c55e");
    return;
  }

  if (cmd.startsWith("/terminal color:")) {
    applyColor(cmd.split(":")[1]);
    return;
  }

  if (cmd === "/testprox") {
    terminalLog("Testing proxies...");

    for (const p of proxies) {
      try {
        const res = await fetch(p.url + encodeURIComponent("https://example.com"));
        if (res.ok) terminalLog("[ONLINE] " + p.name);
        else terminalLog("[BLOCKED] " + p.name);
      } catch {
        terminalLog("[ERROR] " + p.name);
      }
    }

    return;
  }

  terminalLog("Unknown command");
}

</script>
