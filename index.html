<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Link Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1f2937;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 900px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #results {
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      border-top: 1px solid #374151;
      padding-top: 15px;
    }

    .link-card {
      background: #374151;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      word-break: break-all;
    }

    .good { color: #22c55e; }
    .bad { color: #ef4444; }

    iframe {
      width: 100%;
      height: 520px;
      border: none;
      border-radius: 12px;
      background: white;
    }

    select {
      padding: 10px;
      border-radius: 10px;
      background: #374151;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px;">
      <select id="proxySelect"></select>
      <button onclick="cycleProxy()">Cycle Proxy</button>
    </div>

    <h1>Link Checker + Live Preview</h1>

    <div class="input-row">
      <input id="urlInput" placeholder="https://example.com" />
      <button onclick="checkLinks()">Check</button>
    </div>

    <div id="results"></div>

    <div style="margin-top:20px;">
      <h3>Site Preview</h3>
      <iframe id="siteFrame"></iframe>
    </div>

  </div>

<script>

// NOTE: many proxies WILL fail depending on site blocking/X-Frame-Options
const proxies = [
  { name: "AllOrigins RAW", url: "https://api.allorigins.win/raw?url=" },
  { name: "AllOrigins GET", url: "https://api.allorigins.win/get?url=" },
  { name: "CodeTabs", url: "https://api.codetabs.com/v1/proxy?quest=" },
  { name: "ThingProxy", url: "https://thingproxy.freeboard.io/fetch/" },
  { name: "CorsProxy.io", url: "https://corsproxy.io/?" },
  { name: "YACDN", url: "https://yacdn.org/proxy/" },
  { name: "CORS.isomorphic-git", url: "https://cors.isomorphic-git.org/" },
  { name: "AllOrigins Alt", url: "https://api.allorigins.win/raw?url=" },
  { name: "Codetabs Alt", url: "https://api.codetabs.com/v1/proxy?quest=" }
];

let proxyIndex = 0;

const proxySelect = document.getElementById('proxySelect');

function loadProxies() {
  proxySelect.innerHTML = '';
  proxies.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = p.name;
    proxySelect.appendChild(opt);
  });
}

function getProxyUrl(url) {
  const p = proxies[proxyIndex];
  return p.url + encodeURIComponent(url);
}

function cycleProxy() {
  proxyIndex = (proxyIndex + 1) % proxies.length;
  proxySelect.value = proxyIndex;
}

proxySelect.addEventListener('change', (e) => {
  proxyIndex = parseInt(e.target.value);
});

loadProxies();
proxySelect.value = proxyIndex;

async function checkLinks() {
  const url = document.getElementById('urlInput').value.trim();
  const results = document.getElementById('results');
  const iframe = document.getElementById('siteFrame');

  if (!url) return alert('Enter URL');

  results.innerHTML = 'Loading...';

  const fetchUrl = getProxyUrl(url);

  try {
    // LIVE VIEW (best effort)
    iframe.src = fetchUrl;

    // link scan
    const res = await fetch(fetchUrl);
    const html = await res.text();

    const base = new URL(url);
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const links = [...doc.querySelectorAll('a[href]')]
      .map(a => a.href)
      .filter(h => h.startsWith('http'));

    const external = links.filter(l => {
      try {
        return new URL(l).hostname !== base.hostname;
      } catch {
        return false;
      }
    });

    results.innerHTML = `<b>${external.length} external links</b>`;

    external.forEach(l => {
      const div = document.createElement('div');
      div.className = 'link-card';
      div.innerHTML = `<a href="${l}" target="_blank">${l}</a><div class="good">external</div>`;
      results.appendChild(div);
    });

  } catch (e) {
    results.innerHTML = '<span class="bad">Failed to load</span> ' + e.message;
  }
}

</script>
</body>
</html>
