<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Link Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1f2937;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 900px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    select {
      padding: 10px;
      border-radius: 10px;
      background: #374151;
      color: white;
      border: none;
      margin-bottom: 15px;
    }

    iframe {
      width: 100%;
      height: 520px;
      border: none;
      border-radius: 12px;
      background: white;
    }

    #results {
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
      border-top: 1px solid #374151;
      padding-top: 15px;
    }

    .link-card {
      background: #374151;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      word-break: break-all;
    }

    .good { color: #22c55e; }
    .bad { color: #ef4444; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Link Checker + Live Preview</h1>

    <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
      <select id="proxySelect"></select>
    </div>

    <div class="input-row">
      <input id="urlInput" placeholder="https://example.com" />
      <button onclick="checkLinks()">Check</button>
    </div>

    <!-- PREVIEW FIRST -->
    <h3>Site Preview</h3>
    <iframe id="siteFrame"></iframe>

    <!-- RESULTS UNDER PREVIEW -->
    <div id="results"></div>

  </div>

<script>

const proxies = [
  { name: "CorsProxy.io", url: "https://corsproxy.io/?" },
  { name: "AllOrigins RAW", url: "https://api.allorigins.win/raw?url=" },
  { name: "AllOrigins GET", url: "https://api.allorigins.win/get?url=" },
  { name: "ThingProxy", url: "https://thingproxy.freeboard.io/fetch/" },
  { name: "YACDN Proxy", url: "https://yacdn.org/proxy/" },
  { name: "CORS Isomorphic", url: "https://cors.isomorphic-git.org/" },
  { name: "CodeTabs", url: "https://api.codetabs.com/v1/proxy?quest=" },
  { name: "CORS Anywhere", url: "https://cors-anywhere.herokuapp.com/" },
  { name: "Proxy.CORS.sh", url: "https://proxy.cors.sh/" }
];

const proxySelect = document.getElementById('proxySelect');

proxies.forEach((p, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = p.name;
  proxySelect.appendChild(opt);
});

function normalize(url) {
  if (!url.startsWith('http')) url = 'https://' + url;
  return url;
}

function getProxyUrl(url) {
  const proxy = proxies[proxySelect.value];
  return proxy.url + encodeURIComponent(url);
}

async function checkLinks() {
  const urlInput = document.getElementById('urlInput').value.trim();
  const results = document.getElementById('results');
  const iframe = document.getElementById('siteFrame');

  if (!urlInput) return alert('Enter URL');

  const url = normalize(urlInput);

  results.innerHTML = 'Loading...';

  try {
    const proxyUrl = getProxyUrl(url);

    // LIVE PREVIEW
    iframe.src = proxyUrl;

    // FETCH FOR LINKS
    const res = await fetch(proxyUrl);
    const html = await res.text();

    const base = new URL(url);
    const doc = new DOMParser().parseFromString(html, 'text/html');

    const links = [...doc.querySelectorAll('a[href]')]
      .map(a => a.href)
      .filter(h => h.startsWith('http'));

    const external = links.filter(l => {
      try {
        return new URL(l).hostname !== base.hostname;
      } catch {
        return false;
      }
    });

    results.innerHTML = `<b>${external.length} external links found</b>`;

    external.forEach(l => {
      const div = document.createElement('div');
      div.className = 'link-card';
      div.innerHTML = `<a href="${l}" target="_blank">${l}</a><div class="good">external</div>`;
      results.appendChild(div);
    });

  } catch (e) {
    results.innerHTML = '<span class="bad">Failed to load</span> ' + e.message;
  }
}

</script>

</body>
</html>
